<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Monencoll</title>
  
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="apple-touch-icon" href="images/icon-192.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #f0f0f0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      overflow: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      width: 390px;
      height: 100dvh;
      max-height: 844px;
      max-width: 100vw;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* --- МОЛНИИ --- */
    .bg-lightning {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .bg-lightning .bolt {
      position: absolute;
      will-change: transform;
    }
    .bg-lightning svg {
      width: 100%;
      height: 100%;
      display: block;
      fill: #000000;
    }

    /* --- ШАПКА --- */
    .header {
      padding: 20px 24px 10px 24px;
      border-bottom: 1px solid #e0e0e0;
      width: 100%;
      position: relative;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #ffffff;
    }
    h1 {
      display: inline-flex;
      font-family: 'Unbounded', Arial, sans-serif;
      font-size: 16px;
      font-weight: 500;
      letter-spacing: 0.5px;
      color: #000000;
      line-height: 1;
      margin: 0;
    }

    .account-icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      position: relative;
      z-index: 50;
      background: #ffffff;
    }
    .account-icon svg {
      width: 100%;
      height: 100%;
      display: block;
      fill: #333333;
      position: absolute;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    .account-icon .icon-profile { opacity: 1; transform: scale(1); }
    .account-icon .icon-back { opacity: 0; transform: scale(0.5); }
    .account-icon.is-back .icon-profile { opacity: 0; transform: scale(0.5); }
    .account-icon.is-back .icon-back { opacity: 1; transform: scale(1); }

    /* =========================================
       ГЛАВНЫЙ ЭКРАН (без фото и панели)
       ========================================= */
    .main-screen {
      flex: 1;
      position: relative;
      z-index: 1;
      transition: opacity 0.4s ease;
    }

    .collection-row {
      padding: 16px 24px 0 24px;
      display: flex;
      align-items: stretch;
      gap: 20px;
      width: 100%;
      position: relative;
      z-index: 1;
    }
    .collection-card {
      flex: 1;
      height: 90px;
      border: 2px solid #e0e0e0;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      padding: 12px 20px;
      background: rgba(255, 255, 255, 0.8);
    }
    .counter {
      font-family: 'Unbounded', Arial, sans-serif;
      font-size: 28px;
      font-weight: 700;
      color: #000000;
      line-height: 1;
    }
    .subtitle {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 12px;
      color: #666666;
      margin-top: 4px;
    }
    .add-btn {
      width: 90px;
      height: 90px;
      background: linear-gradient(180deg, #4a4a4a 0%, #2a2a2a 60%, #1c1c1c 100%);
      border-radius: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      cursor: pointer;
      flex-shrink: 0;
    }
    .add-btn svg {
      width: 28px;
      height: 28px;
      display: block;
      stroke: #ffffff;
      stroke-width: 2;
      fill: none;
      pointer-events: none;
    }

    /* =========================================
       ПАНЕЛЬ И ФОТО (ВЫНЕСЕНЫ)
       ========================================= */

    /* Нижняя панель (z-index выше шапки) */
    .bottom-sheet {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 90px;
      background: linear-gradient(180deg, #2a2a2a 0%, #1a1a1a 100%);
      border-radius: 24px 24px 0 0;
      z-index: 30; /* ВЫШЕ ШАПКИ (10) */
      transition: height 0.7s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease, transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
      transform: translateY(0); 
      box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.3);
      overflow: visible;
      cursor: pointer;
    }
    .bottom-sheet.open {
      height: 100dvh;
      overflow-y: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      cursor: default;
    }
    .bottom-sheet.open::-webkit-scrollbar {
      display: none;
    }
    .bottom-sheet.hidden {
    opacity: 0;
    transform: translateY(100%);
    pointer-events: none;
    } 

    .close-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 24px;
      height: 24px;
      display: none; 
      justify-content: center;
      align-items: center;
      cursor: pointer;
      z-index: 50; 
      pointer-events: auto;
    }
    .bottom-sheet.open .close-btn {
      display: flex;
    }
    .close-btn svg {
      width: 100%;
      height: 100%;
      fill: #ffffff;
      opacity: 0.7;
      transition: opacity 0.2s;
    }
    .close-btn:hover svg {
      opacity: 1;
    }

    .extra-content {
      position: absolute;
      top: 120px;
      left: 0;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      opacity: 0;
      transition: opacity 0.5s ease; 
      pointer-events: none;
      padding: 0 24px;
    }
    .bottom-sheet.open .extra-content {
      opacity: 1;
      pointer-events: auto;
      transition-delay: 0.15s; 
    }
    .extra-content p {
      font-size: 14px;
      color: #b0b0b0;
      line-height: 1.4;
      max-width: 280px;
      margin: 0 auto 12px;
      text-align: center;
    }

    /* Фото (выше всего) */
    .photo-layer {
      position: absolute;
      left: 0;
      width: 100%;
      bottom: 90px; 
      display: flex;
      justify-content: center;
      z-index: 100; /* Выше панели и шапки */
      pointer-events: none;
      transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease;
      transform: translateY(130px); 
    }
    .bottom-sheet.open ~ .photo-layer {
      transform: translateY(calc(-100dvh + 90px + 130px)); 
    }
    .photo-container {
      width: 260px;
      pointer-events: auto;
      cursor: pointer;
    }
    .photo-container img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
      -webkit-user-drag: none;
      -khtml-user-drag: none;
      -moz-user-drag: none;
      -o-user-drag: none;
      user-drag: none;
      pointer-events: none;
      -webkit-touch-callout: none;
      user-select: none;
    }
    .photo-layer.hidden {
     opacity: 0;
     transform: translateY(calc(100dvh + 100%));
     transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.5s ease;
     pointer-events: none;
     }

    /* Затемнение (под панелью, но над главным экраном) */
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.3);
      z-index: 20; /* Выше главного экрана (1) и шапки? Нет, ниже шапки (10). Но выше контента. */
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease; 
    }
    .overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* =========================================
       ПЛАТФОРМА ПРОФИЛЯ
       ========================================= */
    .platform-profile {
      position: absolute;
      top: 78px;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 5;
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 40px;
      
      opacity: 0;
      pointer-events: none;
      visibility: hidden;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }
    .platform-profile.active {
      opacity: 1;
      pointer-events: auto;
      visibility: visible;
    }

    .profile-avatar {
  width: 104px;
  height: 104px;
  border-radius: 50%;
  background: linear-gradient(180deg, #4a4a4a 0%, #2a2a2a 60%, #1c1c1c 100%);
  display: flex;
  justify-content: center;
  align-items: center;
  margin-bottom: 24px;
  flex-shrink: 0;
}

.profile-avatar svg {
  position: relative;
  z-index: 3;
  width: 48px;
  height: 48px;
  display: block;
  fill: #ffffff;
}

/* Слой искр */
.profile-avatar {
  overflow: visible;
}

.spark-container {
  position: absolute;
  inset: 0;
  z-index: 2;
  pointer-events: none;
  overflow: visible;
}

.spark {
  position: absolute;
  left: 50%;
  top: 65%;
  width: 4px;
  height: 4px;
  margin-left: -2px;
  margin-top: -2px;
  border-radius: 50%;
  background: #ff9b42;
  box-shadow:
    0 0 5px #ff7a24,
    0 0 10px #ff4b1f;
  opacity: 0;
  pointer-events: none;
  will-change: transform, opacity;
}

/* Прыжковое сжатие кружка */

@keyframes avatar-squash {
  0% {
    transform: scale(1, 1);
  }

  18% {
    transform: scale(0.88, 0.88);
  }

  42% {
    transform: scale(1.06, 1.06);
  }

  65% {
    transform: scale(0.97, 0.97);
  }

  82% {
    transform: scale(1.015, 1.015);
  }

  100% {
    transform: scale(1, 1);
  }
}

/* --- ЭФФЕКТ УДАРА МОЛНИИ --- */

.profile-avatar {
  position: relative;
  isolation: isolate;
}

.profile-avatar::before,
.profile-avatar::after {
  content: "";
  position: absolute;
  inset: -12px;
  border-radius: 50%;
  border: 2px solid rgba(255, 255, 255, 0);
  opacity: 0;
  pointer-events: none;
}

.profile-avatar.lightning-hit {
  animation:
  avatar-flash 2s ease-out,
  avatar-squash 0.65s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.profile-avatar.lightning-hit svg {
  animation: bolt-flash 1.1s ease-out;
  transform-origin: center;
}

.profile-avatar.lightning-hit::before {
  animation: electric-ring 2.0s ease-out;
}

.profile-avatar.lightning-hit::after {
  animation: electric-ring 2.0s ease-out 0.1s;
}

@keyframes avatar-flash {
  0% {
    box-shadow: 0 0 0 rgba(255,255,255,0);
  }
  20% {
    box-shadow: 0 0 35px 12px rgba(255,255,255,0.8);
  }
  100% {
    box-shadow: 0 0 0 rgba(255,255,255,0);
  }
}

@keyframes bolt-flash {
  0%, 100% {
    filter: brightness(1);
    transform: scale(1, 1) rotate(0deg);
  }

  8% {
    filter: brightness(2.8) drop-shadow(0 0 12px white);
    transform: scale(1.3, 1.7) rotate(-12deg);
  }

  14% {
    transform: scale(1.25, 1.45) rotate(11deg);
  }

  20% {
    transform: scale(1.3, 1.8) rotate(-10deg);
  }

  26% {
    transform: scale(1.2, 1.5) rotate(9deg);
  }

  33% {
    transform: scale(1.25, 1.75) rotate(-7deg);
  }

  42% {
    transform: scale(1.15, 1.4) rotate(5deg);
  }

  55% {
    filter: brightness(1.7) drop-shadow(0 0 7px white);
    transform: scale(0.85, 0.75) rotate(-3deg);
  }

  68% {
    transform: scale(1.08, 1.25) rotate(2deg);
  }

  82% {
    transform: scale(0.97, 0.95) rotate(0deg);
  }
}

@keyframes electric-ring {
  0% {
    transform: scale(0.7);
    opacity: 0;
    border-color: rgba(255,255,255,0);
  }
  25% {
    opacity: 1;
    border-color: rgba(255,255,255,0.9);
  }
  100% {
    transform: scale(1.8);
    opacity: 0;
    border-color: rgba(255,255,255,0);
  }
}

    .platform-profile h2,
    .platform-profile p {
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    .platform-profile.active h2 {
      opacity: 1;
      transform: translateY(0);
      transition-delay: 0s;
    }
    .platform-profile.active p {
      opacity: 1;
      transform: translateY(0);
      transition-delay: 0.15s;
    }
    .platform-profile h2 {
      font-family: 'Unbounded', Arial, sans-serif;
      font-size: 24px;
      font-weight: 700;
      color: #000;
      margin-bottom: 20px;
    }
    .platform-profile p {
      font-size: 14px;
      color: #666;
      text-align: center;
      max-width: 280px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <div class="bg-lightning" id="bgLightning"></div>

    <div class="header">
      <h1>Monencoll</h1>
      <div class="account-icon" id="accountBtn">
        <svg class="icon-profile" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="10" fill="none" stroke="#333" stroke-width="1.5"/>
          <circle cx="12" cy="10" r="3.5" fill="#333"/>
          <path d="M5.5 19.2C6.8 16.3 9.2 15 12 15s5.2 1.3 6.5 4.2" stroke="#333" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        </svg>
        <svg class="icon-back" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <circle cx="12" cy="12" r="10" fill="none" stroke="#333" stroke-width="1.5"/>
          <path d="M15.41 16.59L10.83 12l4.58-4.59L14 6l-6 6 6 6 1.41-1.41z" fill="#333"/>
        </svg>
      </div>
    </div>

    <div class="main-screen" id="mainScreen">
      <div class="collection-row">
        <div class="collection-card">
          <div class="counter">0</div>
          <div class="subtitle">У вас в коллекции</div>
        </div>
        <div class="add-btn">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 12h10" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>
    </div>

    <div class="platform-profile" id="platformProfile">
  <div class="profile-avatar" aria-hidden="true">
  <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <path d="M13 2L4 14h6l-1 8 9-12h-6l1-8z"/>
</svg>
<div class="spark-container"></div>
</div>

  <h2>Ваш профиль</h2>
      <p>Здесь будет статистика собранных наклеек, достижения и настройки аккаунта.</p>
    </div>

    <!-- ВЫНЕСЕННЫЕ ЭЛЕМЕНТЫ -->
    <div class="overlay" id="overlay"></div>

    <div class="bottom-sheet" id="bottomSheet">
      <div class="close-btn" id="closeBtn">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
        </svg>
      </div>
      <div class="extra-content">
        <p>Здесь будет отображаться список всех собранных наклеек Monster Energy.</p>
        <p>Нажмите на крестик, чтобы свернуть панель.</p>
      </div>
    </div>

    <div class="photo-layer" id="photoLayer">
      <div class="photo-container">
        <img src="images/monster-energy.png" alt="Monster Energy" />
      </div>
    </div>
  </div>

<audio id="lightningSound" preload="auto">
  <source src="sounds/lightning.mp3" type="audio/mpeg">
</audio>

  <script>
    // --- 1. МОЛНИИ ---
    const layer = document.getElementById('bgLightning');
    const boltSvg = `
      <svg viewBox="-6 0 36 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M13 2L4 14h6l-1 8 9-12h-6l1-8z"/>
      </svg>
    `;

    class Bolt {
      constructor(container) {
        this.el = document.createElement('div');
        this.el.className = 'bolt';
        this.el.innerHTML = boltSvg;
        this.size = 14 + Math.random() * 24;
        this.baseOpacity = 0.03 + Math.random() * 0.07;
        this.el.style.width = this.size + 'px';
        this.el.style.height = this.size + 'px';
        this.el.style.opacity = this.baseOpacity;

        const rect = container.getBoundingClientRect();
        this.x = Math.random() * rect.width;
        this.y = Math.random() * rect.height;
        const angle = Math.random() * Math.PI * 2;
        const speed = 0.15 + Math.random() * 0.25;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.rot = Math.random() * 360;
        this.rotSpeed = (Math.random() - 0.5) * 0.3;
        this.maxX = rect.width;
        this.maxY = rect.height;
        container.appendChild(this.el);
        this.draw();
      }

      draw() {
        this.el.style.transform =
          `translate(${this.x}px, ${this.y}px) rotate(${this.rot}deg)`;
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.rot += this.rotSpeed;
        if (this.x < 0) { this.x = 0; this.vx *= -1; }
        if (this.x > this.maxX - this.size) { this.x = this.maxX - this.size; this.vx *= -1; }
        if (this.y < 0) { this.y = 0; this.vy *= -1; }
        if (this.y > this.maxY - this.size) { this.y = this.maxY - this.size; this.vy *= -1; }
        this.draw();
      }
    }

    const bolts = [];
    const COUNT = 40;
    for (let i = 0; i < COUNT; i++) {
      bolts.push(new Bolt(layer));
    }

    function loop() {
      for (const b of bolts) b.update();
      requestAnimationFrame(loop);
    }
    loop();

    // --- 2. ЛОГИКА ---
    const accountBtn = document.getElementById('accountBtn');
    const platformProfile = document.getElementById('platformProfile');
    const mainScreen = document.getElementById('mainScreen');
    
    const sheet = document.getElementById('bottomSheet');
    const overlay = document.getElementById('overlay');
    const closeBtn = document.getElementById('closeBtn');
    const photoLayer = document.getElementById('photoLayer');
    const photoContainer = document.querySelector('.photo-container');

    let isProfileOpen = false;

function lightningVibration() {
  if (!('vibrate' in navigator)) return;

  navigator.vibrate([
    35, 25,
    35, 25,
    35, 60,
    180, 50,
    35, 25,
    35
  ]);
}

    function openProfile() {
      if (isProfileOpen) return;
      isProfileOpen = true;

setTimeout(() => {
  const avatar = document.querySelector('.profile-avatar');

  avatar.classList.remove('lightning-hit');
  void avatar.offsetWidth;

  const lightningSound = document.getElementById('lightningSound');

avatar.classList.add('lightning-hit');

lightningVibration();

lightningSound.pause();
lightningSound.currentTime = 0;
lightningSound.volume = 0.35;

lightningSound.play().catch(() => {});

  const sparkContainer = avatar.querySelector('.spark-container');

sparkContainer.innerHTML = '';

const sparks = [];

const random = (min, max) =>
  Math.random() * (max - min) + min;

// Создаём искры
for (let i = 0; i < 18; i++) {
  const spark = document.createElement('span');
  spark.className = 'spark';

  const angle = random(0, Math.PI * 2);
  const speed = random(2.5, 5.5);

  sparks.push({
    el: spark,

    x: 0,
    y: 0,

    vx: Math.cos(angle) * speed,
    vy: Math.sin(angle) * speed,

    gravity: random(0.07, 0.12),
    drag: random(0.990, 0.996),

    life: 0,
    duration: random(1100, 1600)
  });

  spark.style.background = Math.random() > 0.5
    ? '#ffad45'
    : '#ff5733';

  sparkContainer.appendChild(spark);
}

// Запускаем физическую анимацию
let lastTime = 0;

function animateSparks(timestamp) {
  if (!lastTime) lastTime = timestamp;

  const delta = Math.min((timestamp - lastTime) / 16.67, 2);
  lastTime = timestamp;

  let activeSparks = 0;

  sparks.forEach(spark => {
    if (spark.life >= spark.duration) {
      spark.el.remove();
      return;
    }

    activeSparks++;

    spark.life += delta * 16.67;

    // Замедление движения
    const friction = Math.pow(spark.drag, delta);

    spark.vx *= friction;
    spark.vy *= friction;

    // Постепенное притяжение вниз
    spark.vy += spark.gravity * delta;

    // Обновление положения
    spark.x += spark.vx * delta;
    spark.y += spark.vy * delta;

    // Угасание
    const progress = spark.life / spark.duration;

    const opacity = progress < 0.08
      ? progress / 0.08
      : 1 - (progress - 0.08) / 0.92;

    const scale = 1.2 - progress * 1.1;

    spark.el.style.opacity = Math.max(0, opacity);

    spark.el.style.transform =
      `translate3d(${spark.x}px, ${spark.y}px, 0) scale(${scale})`;
  });

  if (activeSparks > 0) {
    requestAnimationFrame(animateSparks);
  }
}

requestAnimationFrame(animateSparks);
}, 500);

      accountBtn.classList.add('is-back');
      platformProfile.classList.add('active');
      
      mainScreen.style.opacity = '0';
      mainScreen.style.pointerEvents = 'none';
      
      photoLayer.classList.add('hidden');
      sheet.classList.add('hidden');
      
      sheet.classList.remove('open');
      overlay.classList.remove('active');
    }

const lightningSound = document.getElementById('lightningSound');

lightningSound.preload = 'auto';
lightningSound.load();

    function closeProfile() {
      if (!isProfileOpen) return;
      isProfileOpen = false;

      platformProfile.classList.remove('active');
      accountBtn.classList.remove('is-back');
      
      photoLayer.classList.remove('hidden');
      sheet.classList.remove('hidden');
      
      setTimeout(() => {
        mainScreen.style.opacity = '1';
        mainScreen.style.pointerEvents = 'auto';
      }, 150);
    }

    accountBtn.addEventListener('click', () => {
      if (isProfileOpen) {
        closeProfile();
      } else {
        openProfile();
      }
    });

    // --- 3. ЛОГИКА КОЛЛЕКЦИИ ---
    sheet.addEventListener('click', (e) => {
      if (e.target.closest('.close-btn')) return;
      if (!sheet.classList.contains('open')) {
        sheet.classList.add('open');
        overlay.classList.add('active');
      }
    });

    photoContainer.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!sheet.classList.contains('open') && !isProfileOpen) {
        sheet.classList.add('open');
        overlay.classList.add('active');
      }
    });

    closeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      sheet.classList.remove('open');
      overlay.classList.remove('active');
    });

    overlay.addEventListener('click', () => {
      sheet.classList.remove('open');
      overlay.classList.remove('active');
    });

    // --- 4. ОТКЛЮЧЕНИЕ МЕНЮ ДЛЯ ФОТО ---
    const photoImg = document.querySelector('.photo-container img');
    if (photoImg) {
      photoImg.addEventListener('contextmenu', (e) => e.preventDefault());
      photoImg.addEventListener('dragstart', (e) => e.preventDefault());
    }

    // --- 5. SERVICE WORKER ---
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('SW зарегистрирован:', reg))
          .catch(err => console.log('Ошибка SW:', err));
      });
    }
  </script>
</body>
